name: Docs sync agent

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/generated/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-sync
  cancel-in-progress: true

env:
  CLAUDE_CODE_VERSION: "2.1.302"
  UV_VERSION: "0.13.5"
  DOCS_MODEL: claude-sonnet-5-5
  DOCS_BUDGET_USD: "5"
  DOCS_BRANCH: docs/sync

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv and Claude Code
        run: |
          curl -LsSf "https://astral.sh/uv/$UV_VERSION/install.sh" | sh
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Prepare inputs
        run: |
          mkdir -p .agent
          last=$(cat docs/generated/.last_sync 2>/dev/null || true)
          if [ -n "$last" ] && git cat-file -e "$last^{commit}" 2>/dev/null; then
            git log --no-merges --date=short --format='%h %ad %s' "$last..HEAD" > .agent/commits.txt
            git diff --name-only "$last" HEAD > .agent/changed_files.txt
          else
            git log --no-merges --date=short --format='%h %ad %s' > .agent/commits.txt
            git ls-files > .agent/changed_files.txt
          fi
          uv sync --frozen --no-dev
          uv run --no-sync python scripts/agents/licences.py > .agent/licences.json

      - name: Run docs agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude --version
          set +e
          claude -p "/docs-sync" \
            --model "$DOCS_MODEL" \
            --settings .claude/ci-settings.json \
            --allowedTools "Read,Glob,Grep,Edit(./docs/generated/**),Write(./docs/generated/**)" \
            --permission-mode dontAsk \
            --output-format json \
            --max-budget-usd "$DOCS_BUDGET_USD" \
            --no-session-persistence \
            > .agent/result.json
          status=$?
          set -e
          if [ "$status" -ne 0 ] || ! jq -e '.is_error == false' .agent/result.json > /dev/null; then
            echo "Claude Code failed (exit $status). Output:" >&2
            jq '{is_error, subtype, result, total_cost_usd}' .agent/result.json >&2 || cat .agent/result.json >&2
            exit 1
          fi
          jq -r '"Agent cost (USD, estimate): \(.total_cost_usd)\n\n\(.result)"' .agent/result.json >> "$GITHUB_STEP_SUMMARY"

      - name: Check the agent only touched docs/generated
        run: |
          unexpected=$(git status --porcelain --untracked-files=all | grep -v ' docs/generated/' || true)
          if [ -n "$unexpected" ]; then
            echo "Agent changed files outside docs/generated:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Verify citations
        run: python3 scripts/agents/check_citations.py docs/generated

      - name: Open or update the docs PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard docs/generated)" ]; then
            echo "Docs already up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git rev-parse HEAD > docs/generated/.last_sync
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$DOCS_BRANCH"
          git add docs/generated
          git commit -m "docs: sync generated documentation to $(git rev-parse --short HEAD)"
          git push --force origin "$DOCS_BRANCH"
          if [ "$(gh pr view "$DOCS_BRANCH" --json state -q .state 2>/dev/null)" != "OPEN" ]; then
            gh pr create --base main --head "$DOCS_BRANCH" \
              --title "docs: sync generated documentation" \
              --body "Generated by the docs sync agent from the code on main. Every citation was checked by scripts/agents/check_citations.py. Review before merging."
          fi
