[project]
name = "fabric-ui"
version = "0.1.0"
description = "Secure web app for browsing, reporting on and exporting Microsoft Fabric gold data."
requires-python = "==3.12.*"
dependencies = [
    "Django==5.2.18",
    "mssql-django==1.8.0",
    "pyodbc==5.3.0",
    "azure-identity==1.26.0",
    "openpyxl==3.1.5",
    "PyYAML==6.0.3",
    "gunicorn==26.2.0",
    "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "ruff==0.17.2",
]

[tool.uv]
# Application, not a library: install dependencies only.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
# Design docs contain illustrative snippets; migrations are generated.
extend-exclude = ["docs", "**/migrations"]

[tool.ruff.lint.per-file-ignores]
# Django declares Meta options such as indexes and form fields as class level lists.
"**/models.py" = ["RUF012"]
"**/forms.py" = ["RUF012"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "fabric_ui.settings"
django_find_project = false
pythonpath = ["app", "scripts"]
testpaths = ["app", "scripts"]
addopts = "-ra --strict-markers"
# Unit tests do not run collectstatic, so WhiteNoise finds no STATIC_ROOT.
filterwarnings = ["ignore:No directory at:UserWarning"]
markers = [
    "integration: needs Azure SQL or Fabric; skipped unless configured",
]
